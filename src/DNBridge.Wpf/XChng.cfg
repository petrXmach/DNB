# =====================================================================
# XChng.cfg  —  TEMPORARY main104 (regulation parameter) mapping
# =====================================================================
# Gateway-side declaration of the Main104 IEC 104 points for the
# traffic-loop test (SCADA <-> DNBridge <-> DNC+dll). Removed after
# Stage-1 migration, when DNC declares these via RegisterElements.
#
# Format: <address> <TAB> <id> <TAB> <iec104_type> [<TAB> M | <TAB> <default>]
#         (# / // = comment)
#   address : CCC.CCC.III.III.III  (CA in groups 1-2, IOA in groups 3-5)
#             all CA = 000.001 here
#   id      : Main104 bare id (OR-ed with 0xC0000000 internally)
#             id <  100  => INPUT  (SCADA -> DNC, delivered by reverse-Poke)
#             id >= 100  => OUTPUT (DNC -> SCADA, sent on Poke)
#   type    : numeric IEC 104 TypeID
#             45=C_SC_NA_1  46=C_DC_NA_1  63=C_SE_TC_1
#             30=M_SP_TB_1  36=M_ME_TF_1
#   default : optional 4th column on an INPUT line = startup value, used until SCADA
#             sends a real one. Seeded into the cache as if SCADA had sent it (so the
#             mirrors echo it too) and pushed to DNC by reverse-Poke at registration,
#             which overwrites DNC's own ini/hardcoded default. A later SCADA value
#             replaces it. Units are the WIRE units SCADA would send:
#               id 1 Active   0/1        id 2 RegMode  0-3
#               id 4/5 UNet   %          id 6/7 Qvvn/Q_tor  kVAr (NOT MVAr, NOT VAr)
#             Decimal POINT, not comma. Omit to leave the input at 0 / unsent.
#   M       : optional 4th column = MIRROR line. 'address' is a NEW output
#             address, 'id' names the SOURCE input to echo, 'type' is the
#             control type to send it with. DNBridge (not DNC) re-sends the
#             input's cached value to SCADA at 'address' whenever DNC pokes the
#             State output (id 102) — i.e. once per calc cycle, on OK and error.
#             The referenced input line MUST appear earlier in this file.
#
# id  name        IOA(dec)   role     default
# --- ----------- ---------- ------   -------
# 1   Active      1103       input    1        (on)
# 2   RegMode     1104       input    1        (rm_MinTransfQ = "Min pretok Q")
# 4   UNet_Max    1107       input    8.0      %
# 5   UNet_min    1108       input    -8.0     %
# 6   Qvvn        1105       input    1000.0   kVAr  (= 1e6 VAr internally in DNC)
# 7   Qtor        1106       input    5000.0   kVAr  (= 5e6 VAr internally in DNC)
# 102 State       1000       output
# 103 Qmin        1101       output
# 104 Qmax        1100       output
# 105 Loss        1102       output
# --- input mirrors (SCADA in -> SCADA out, echoed by DNBridge on State poke) ---
# 1   Active      1203       mirror  (src id 1, M_SP_TB_1)
# 2   RegMode     1204       mirror  (src id 2, M_DP_TB_1)
# 4   UNet_Max    1207       mirror  (src id 4, M_ME_TF_1)
# 5   UNet_min    1208       mirror  (src id 5, M_ME_TF_1)
# 6   Qvvn        1205       mirror  (src id 6, M_ME_TF_1)
# 7   Qtor        1206       mirror  (src id 7, M_ME_TF_1)
# =====================================================================

